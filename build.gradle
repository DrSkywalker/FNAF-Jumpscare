plugins {
    id 'net.neoforged.moddev' version '2.0.71-beta'
}

group = 'net.lee'
def modId = (project.findProperty('modid') ?: 'fnafmod').toString()
def modVersion = (project.findProperty('mod_version') ?: '1.0.0').toString()
def mcVersion = (project.findProperty('minecraft_version') ?: '1.21.1').toString()
def neoforgeVersion = (project.findProperty('neoforge_version') ?: '21.1.42').toString()
def modName = (project.findProperty('mod_name') ?: 'FNAF Jumpscare (NeoForge)').toString()
def modAuthors = (project.findProperty('mod_authors') ?: 'Lee').toString()
def modDescription = (project.findProperty('mod_description') ?: 'UCN-style jumpscares on any screen, incl. main menu.').toString()

version = modVersion

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

neoForge {
    version = neoforgeVersion

    parchment {
        minecraftVersion = mcVersion
        mappingsVersion = "2024.07.28"
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', modId
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', modId
        }
    }

    mods {
        "${modId}" {
            sourceSet project.sourceSets.main
        }
    }
}

dependencies {
    // NeoForge dependencies are handled by the neoForge block
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('jar', Jar).configure {
    archiveBaseName.set(modId)
    manifest {
        attributes(
                'Implementation-Title': modName,
                'Implementation-Version': modVersion,
                'Implementation-Vendor': modAuthors
        )
    }
}

tasks.named('processResources', ProcessResources).configure {
    // Tell Gradle which tokens we will expand (for up-to-date checks)
    inputs.property 'modid', modId
    inputs.property 'mod_version', modVersion
    inputs.property 'mod_name', modName
    inputs.property 'mod_authors', modAuthors
    inputs.property 'mod_description', modDescription
    inputs.property 'minecraft_version', mcVersion
    inputs.property 'neoforge_version', neoforgeVersion

    // Expand ONLY neoforge.mods.toml (avoid touching JSON/other assets)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand([
                modid            : modId,
                mod_version      : modVersion,
                mod_name         : modName,
                mod_authors      : modAuthors,
                mod_description  : modDescription,
                minecraft_version: mcVersion,
                neoforge_version : neoforgeVersion
        ])
    }
}
